# Stage 1 training (arms A, B, C), design document "Implementation specification (v1)".
# Every arm uses the same tokenizer, encoder size, data, masking sampler and number of steps;
# only the objective differs. Choose the arm with `--arm A|B|C` (overrides `arm` below).
arm: B

model:
  dim: 512                 # token width D
  heads: 8
  mlp_ratio: 4.0
  drop_path: 0.1
  spatial_depth: 6         # per observation, global attention over <= 1,024 cells
  temporal_depth: 4        # per cell, across observations
  pred_dim: 384            # predictor (B, C) and decoder (A) width
  pred_heads: 6
  pred_temporal_depth: 2
  pred_spatial_depth: 2
  decoder_depth: 2         # arm A: blocks per cell over query tokens
  n_fourier: 32            # Fourier features of wavelength for the spectral weight generator
  pace_bands: 172          # PACE OCI AOP Rrs bands (arm C residual decoder)
  checkpoint: true         # gradient checkpointing

data:
  mode: retro              # training windows t0 +/- 15 days (future masking teaches causal use)
  length: 16               # max optical observations per sequence
  sensors: [modisa_oc, viirsn_oc, viirsj1_oc, viirsj2_oc, olcia_efr_oc, olcib_efr_oc, pace_oci_aop]
  pace_era_share: 0.3      # share of sampled sequences from the PACE era (design doc: 25-30%)
  num_workers: 8

masking:
  modes: [[view, 0.4], [time, 0.3], [spatial, 0.2], [future, 0.1]]
  pace_band_keep: [0.2, 1.0]   # spectral dropout: keep 20-100% of PACE bands in the context
  # E2 (released embedding = predictor query at dt = 0 with MODIS-Aqua's ocean-band signature) is
  # trained explicitly: in this share of sequences a hidden PACE or OLCI observation is also given
  # as a synthetic target SRF-convolved onto the MODIS bands (encoded alone at its own dt); native
  # hidden MODIS observations count too.
  e2_reference_prob: 0.1

loss:
  # Modality balancing (brief Objective 5: normalise by valid target tokens, configurable modality
  # weights, do not assume equal averaging is optimal). 'modality': per-family mean squared error
  # (each normalised by its own valid targets), then a weighted mean over the families present in
  # the batch; 'token': one mean over all targets, so modalities with more tokens dominate.
  # Per-family losses are always logged (pred_<FAMILY> / recon_<FAMILY>). Stage 2 adds physics
  # variable groups and the nutrient view as further keys (TODO when stage 2 is built).
  # View groups (design document): MODIS Rrs, VIIRS Rrs (all platforms), OLCI Rrs, PACE Rrs, PACE rhos
  # (SURFACE); stage 2 adds NUTRIENT and the physics groups. TODO (design document): compare equal
  # weights with inverse-frequency and temperature-scaled weights; check that no group's loss stalls.
  balance: modality
  modality_weights: {MODIS: 1.0, VIIRS: 1.0, OLCI: 1.0, PACE: 1.0, SURFACE: 1.0}
  sigreg_mode: group             # SIGReg per view group, equal-weight mean ('pooled': one SIGReg on all)
  sigreg_min_group_tokens: 256   # smaller groups (across GPUs) are pooled for that step
  lambda: 0.05             # (1 - lambda) * prediction + lambda * SIGReg (arms B, C)
  mu: 0.1                  # PACE residual weight (arm C)
  sigreg_slices: 1024
  sigreg_points: 17
  sigreg_t_max: 5.0        # 17 points on [-5, 5] (doubled trapezoid weights on [0, 5])
  sigreg_tokens: 8192      # target tokens per step, across all GPUs

optim:
  lr: 5.0e-4
  min_lr: 1.0e-6
  betas: [0.9, 0.95]
  weight_decay: 0.05
  grad_clip: 1.0
  warmup_frac: 0.05
  steps: 30000             # same for every arm (fitted to the time budget after the benchmark)
  effective_batch: 128     # sequences per optimizer step, across GPUs (accumulation fills the rest)
  per_gpu_batch: 4         # set from the memory benchmark

run:
  precision: bf16
  checkpoint_minutes: 120
  stop_after_hours: 47.0   # save and exit before the 48 h limit; the job resubmits itself
  log_every: 20
  rank_every: 200          # effective rank of E1 embeddings
  seed: 20261112
